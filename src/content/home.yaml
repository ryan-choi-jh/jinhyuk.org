name: Ryan Choi (최진혁)
intro: >-
  Korea born, England raised, San Francisco based. Philosophy, Politics and
  Economics major at Warwick, spent two years carrying a machine gun for the
  Korean Missile Command, and spent a decade exploring how companies get built,
  bought, and sold — Tech M&A at SVB and Moelis, then CoS at Artie.


  I'm interested in arts, technology, philosophy, and the strange business of
  figuring out what makes a life meaningful. I'm particularly drawn to
  philosophy through film — the kind of movies that leave you baffled, then send
  you down an endless maze of questions. *Mulholland Drive, Get Out, Inception,*
  and *Coco* are a few favorites.


  Manchester United fan since 2007. Golfer since age 2, though the evidence
  remains inconclusive.
