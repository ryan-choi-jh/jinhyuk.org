intro: >-
  Hi! I currently live in San Francisco where I'm in the early, uncertain part
  of starting a company: figuring out what's actually worth building.


  Before this, I spent my career close to how companies get built, bought, and
  sold. Tech M&A at SVB and Moelis, then chief of staff at Artie (YC S23), a
  data infra startup. I grew up between Korea and England, studied PPE at
  Warwick, and voluntarily served two years in the Korean military as a
  rifleman.


  The things I keep coming back to are helping people through their hard parts,
  and being honest about my own reasons for doing things. This site is where I
  think in the open. Essays and notes, mostly written to understand something
  rather than to claim I already have.
