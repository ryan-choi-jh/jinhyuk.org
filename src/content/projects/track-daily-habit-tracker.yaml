title: 'Track: Daily Habit Tracker'
url: https://habit-tracker-xi-gilt.vercel.app/welcome
date: 2026-07-07
summary: >-
  A minimalist habit tracker that makes showing up fun by turning your daily
  check-ins into a GitHub-style contribution heatmap.
draft: false
blocks:
  - discriminant: text
    value: >-
      I started coding this year, and Track is one of the first things I built
      for myself instead of as a tutorial exercise. I wanted a habit tracker
      that felt good on the days I showed up and didn't make me feel like
      garbage on the days I didn't. Most of the ones I tried run on streaks and
      guilt. I wanted the opposite; something that quietly rewards consistency
      and forgives the gaps.
  - discriminant: text
    value: >-
      The whole app is built around a GitHub-contribution-style heatmap. When I
      was learning to code, the contribution graph was the first time my own
      effort turned into something I could visualize immediately: a grid filling
      in, square by square. It was almost embarrassingly motivating. I'd push a
      tiny commit just to keep a square lit :) I wanted that exact feeling for
      the offline stuff: water, walks, vitamins, gratitude. Track turns each
      check-in into a square, and a month of showing up turns into a shape you
      can read in a second.
  - discriminant: image
    value:
      src: /projects/track-daily-habit-tracker/blocks/2/value/src.png
      caption: The welcome screen, the first thing I see before logging
  - discriminant: text
    value: >-
      The part I love: you build your own cover!


      This is my favorite detail. The welcome screen is yours to build — you
      choose whatever images get you fired up, and you see them every single
      time you log. Mine is a wall of people at their moment: Tiger Woods
      winning the Masters, Martin Lurther King Jr. at the Lincoln Memorial,
      United lifting their Champions League trophy, a rocket clearing the tower.
      It sounds small, but opening the app to something that actually moves you
      does more for consistency than a push notification ever has.
  - discriminant: image
    value:
      src: /projects/track-daily-habit-tracker/blocks/4/value/src.png
      caption: >-
        Same screen, dark mode — for late-night check-ins, and because it looks
        cool
  - discriminant: text
    value: >-
      The home screen opens on today with each habit as its own card and its
      heatmap sitting right there on the card, so progress is never more than a
      glance away. Tap any row to drill in (there's also a light social touch up
      top if you want to track habits together with your friend).
  - discriminant: image
    value:
      src: /projects/track-daily-habit-tracker/blocks/6/value/src.png
      caption: The dashboard (every habit carries its own heatmap)
  - discriminant: text
    value: >-
      Open a single habit and you get the full picture: current streak, longest
      streak, 30- and 90-day completion rates, a full 365-day heatmap, and a
      month calendar you can page through. This is where the heatmap earns its
      keep — a whole year of one habit in a single look.
  - discriminant: image
    value:
      src: /projects/track-daily-habit-tracker/blocks/8/value/src.png
      caption: One habit, a full year of it
  - discriminant: text
    value: >-
      Every habit is editable: name, category, an emoji for the icon, and a
      color that flows through its heatmap. You can hide a habit from the daily
      prompt while keeping its history, or delete it and its history for good.
  - discriminant: image
    value:
      src: /projects/track-daily-habit-tracker/blocks/10/value/src.png
      caption: Pick an emoji and a color; the heatmap takes that color
  - discriminant: text
    value: >-
      There are three ways to look, and I switch between them by mood. The list
      view squeezes the last 7 days (or 5, or 14) into one tidy row per habit. I
      use it as a quick did-I-actually-do-it check on the week.
  - discriminant: image
    value:
      src: /projects/track-daily-habit-tracker/blocks/12/value/src.png
      caption: List view of the week, compressed
  - discriminant: text
    value: >-
      The overview lays each habit's month out as its own mini-heatmap, all side
      by side. This is the one that scratches the GitHub itch hardest.
  - discriminant: image
    value:
      src: /projects/track-daily-habit-tracker/blocks/14/value/src.png
      caption: The glanceable monthly overview
  - discriminant: text
    value: >-
      Funnily enough, if you look closely at these shots, you'll notice I
      haven't exactly been crushing it lately — a lot of empty squares in the
      recent stretch. I've been heads-down building other things. But that's
      kind of the point of how it's designed: the empty squares don't scold me,
      and the whole pitch is sitting right there on the welcome screen. Showing
      up beats perfect. I'll get tomorrow's square!
